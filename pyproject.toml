[project]
name = "multi-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vinay Kavati", email = "vinaykavati13@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.0",
    "langchain-core>=1.6.0",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.0",
    "tavily-python>=0.8.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "streamlit>=1.30.0",
    "rich>=13.0.0",
    "google-genai",
    "lxml>=5.0.0",
]

[project.scripts]
multi-agent = "multi_agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
